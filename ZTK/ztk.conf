// ZTK OS Main Configuration

[system]
name = "ZTK"
version = "0.1.0"
arch = "x86_64"
target = "desktop-pc"
lang = "ZPPOS"

[paths]
zos = "./zos"
zit = "./zit"
bin = "./bin"
boot = "./boot"
zpp = "./zpp"
var = "./var"
usr = "./usr"

[hardware]
memory = "4096MB"
storage = "ata"
network = "e1000"
graphics = "vesa"
audio = "hda"
keyboard = "ps2"
mouse = "ps2"

[packages]
builtins = [ "ZPP", "os", "Zui+", "mal", "unix", "data", "randombin", "nodejsosserver" ]

[boot]
loader = "boot/boot.zppos"
kernel = "zos/kernel.zppos"
format = "iso"
timeout = 3

[gui]
resolution = "1024x768"
depth = 32
framebuffer = true
theme = "dark"

[server]
enabled = true
port = 8080
interface = "0.0.0.0"
cpu_cores = 2

[data]
enabled = true
extension = "/data@"
encryption = true
retention_days = 30

[startup]
init = "bin/init.zppos"
shell = "bin/shell.zppos"
